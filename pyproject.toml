[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-scorer"
version = "0.1.0"
description = "Public reference implementation of a B2B lead-scoring pipeline (LR baseline + calibrated XGBoost)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshan@agulhascode.co.za" }]
keywords = ["machine-learning", "lead-scoring", "xgboost", "sales", "crm"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "jupyter>=1.0",
    "nbclient>=0.9",
    "nbformat>=5.9",
]

[project.scripts]
lead-scorer = "lead_scorer.pipeline:run_from_csv"

[tool.setuptools.packages.find]
include = ["lead_scorer*"]
exclude = ["tests*", "notebooks*", "data*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"
